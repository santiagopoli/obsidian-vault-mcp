name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Render private deployment configuration
        run: bun run config:production
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          ALLOWED_GITHUB_USER_ID: ${{ vars.ALLOWED_GITHUB_USER_ID }}
          VAULT_REPOSITORIES: ${{ vars.VAULT_REPOSITORIES }}
          VAULT_ACCESS: ${{ vars.VAULT_ACCESS }}
          OMIT_AUTHORIZATION_RESPONSE_ISS: ${{ vars.OMIT_AUTHORIZATION_RESPONSE_ISS }}
          OAUTH_KV_NAMESPACE_ID: ${{ vars.OAUTH_KV_NAMESPACE_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          GITHUB_WEBHOOK_HOOK_ID: ${{ vars.GITHUB_WEBHOOK_HOOK_ID }}
          GITHUB_WEBHOOK_REPOSITORY_ID: ${{ vars.GITHUB_WEBHOOK_REPOSITORY_ID }}
          GITHUB_WEBHOOK_DEFAULT_BRANCH: ${{ vars.GITHUB_WEBHOOK_DEFAULT_BRANCH }}
          GITHUB_WEBHOOK_VAULT: ${{ vars.GITHUB_WEBHOOK_VAULT }}
          EVENT_D1_DATABASE_ID: ${{ vars.EVENT_D1_DATABASE_ID }}
          EVENT_QUEUE_NAME: ${{ vars.EVENT_QUEUE_NAME }}
          EVENT_DLQ_NAME: ${{ vars.EVENT_DLQ_NAME }}
          AUTOMATION_QUEUE_NAME: ${{ vars.AUTOMATION_QUEUE_NAME }}
          AUTOMATION_DLQ_NAME: ${{ vars.AUTOMATION_DLQ_NAME }}
          AUTOMATIONS_YAML: ${{ vars.AUTOMATIONS_YAML }}
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply obsidian-vault-events --remote --config .wrangler/production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --config .wrangler/production.jsonc
